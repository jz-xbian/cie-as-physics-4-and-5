<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FROM JZX — CIE AS Physics</title>
<meta name="description" content="CIE AS Physics 9702 中英对照讲解与抽认卡，FROM JZX。">
<style>
:root {
  --bg: #efe8db;
  --ink: #1b1814;
  --blue: #153a5c;
  --blue-mid: #1f5a86;
  --gold: #8a6910;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", sans-serif;
  --display: "Iowan Old Style", "Palatino Linotype", Palatino, "Times New Roman", Georgia, serif;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: var(--font);
  color: var(--ink);
  min-height: 100%;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(1100px 560px at 50% 38%, #f8f1e2 0%, transparent 62%),
    radial-gradient(800px 420px at 92% 100%, #e4ecf3 0%, transparent 50%),
    var(--bg);
}
.splash {
  position: relative;
  text-align: center;
  padding: 2rem 1.5rem;
}
.splash::before {
  content: "JZX";
  position: absolute; left: 50%; top: 46%;
  transform: translate(-50%, -58%) rotate(-18deg);
  font-family: var(--display);
  font-size: clamp(10rem, 38vw, 22rem);
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--blue);
  opacity: 0.035;
  pointer-events: none;
  line-height: 1;
  user-select: none;
}
.splash-from {
  position: relative;
  font-family: var(--font);
  font-size: clamp(0.82rem, 2vw, 1.05rem);
  font-weight: 700;
  letter-spacing: 0.62em;
  color: var(--gold);
  margin: 0 0 .45rem .62em;
  text-transform: uppercase;
}
.splash-jzx {
  position: relative;
  font-family: var(--display);
  font-size: clamp(5.2rem, 18vw, 9rem);
  font-weight: 600;
  letter-spacing: 0.14em;
  color: var(--blue);
  margin: 0;
  line-height: 0.88;
  text-transform: uppercase;
}
.splash-start {
  position: relative;
  appearance: none;
  display: inline-block;
  margin-top: 2.4rem;
  border: 1.5px solid var(--blue);
  background: var(--blue);
  color: #f6efe2;
  font-family: var(--font);
  font-size: 0.92rem;
  font-weight: 700;
  letter-spacing: 0.38em;
  text-indent: 0.12em;
  text-decoration: none;
  padding: 0.88rem 2.9rem 0.88rem 3.15rem;
  border-radius: 999px;
  cursor: pointer;
  box-shadow: 0 0 0 3px #f3eee3, 0 0 0 5px #c9a227, 0 10px 28px rgba(21,58,92,.2);
  transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
}
.splash-start:hover, .splash-start:focus {
  background: var(--blue-mid);
  color: #f6efe2;
  text-decoration: none;
  transform: translateY(-1px);
  box-shadow: 0 0 0 3px #f3eee3, 0 0 0 5px #c9a227, 0 14px 32px rgba(21,58,92,.26);
}
.splash-start:active { transform: translateY(0); }
.splash-start:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 4px;
}
</style>
</head>
<body>
  <div class="splash">
    <p class="splash-from">FROM</p>
    <p class="splash-jzx">JZX</p>
    <a class="splash-start" id="splash-start" href="notes.html">START</a>
  </div>
  <script>
    const start = document.getElementById("splash-start");
    start.focus();
    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        location.href = start.href;
      }
    });
  </script>
</body>
</html>
